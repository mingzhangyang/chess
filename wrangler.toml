name = "chess"
main = "worker/src/index.ts"
compatibility_date = "2026-09-06"

[vars]
ALLOWED_ORIGINS = "https://chess.orangely.xyz"

[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8787,http://127.0.0.1:8787"

[env.dev.durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
persist = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve assets through the Worker so withSecurityHeaders() applies to them.
# Without this, Cloudflare answers asset requests directly: no COOP/COEP means
# no SharedArrayBuffer, and the threaded Stockfish build cannot start.
run_worker_first = true

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
